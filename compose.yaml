services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reconcile
      POSTGRES_DB: reconcile
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconcile -d reconcile"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    image: reconcile-local:dev
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: runtime
      secrets: [proxy_ca]
    command: ["python", "-m", "reconcile.cli", "migrate"]
    environment: &database
      CODE_VERSION: ${CODE_VERSION:-development}
      DATABASE_URL: postgresql+psycopg://reconcile:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/reconcile
    depends_on:
      db: {condition: service_healthy}
  worker:
    image: reconcile-local:dev
    command: ["python", "-m", "reconcile.worker"]
    environment: *database
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 128
    depends_on:
      migrate: {condition: service_completed_successfully}
  app:
    image: reconcile-local:dev
    ports: ["127.0.0.1:8000:8000"]
    environment:
      <<: *database
      APP_ORIGINS: ${APP_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 128
    depends_on:
      migrate: {condition: service_completed_successfully}
      worker: {condition: service_started}
  test:
    profiles: [test]
    init: true
    image: reconcile-local:test
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: test
      secrets: [proxy_ca]
    environment:
      <<: *database
      HISTORY_TEST_DATABASE_URL: postgresql+psycopg://reconcile:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/reconcile
      APPLICATION_TEST_DATABASE_URL: postgresql+psycopg://reconcile:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/reconcile
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    command: ["python", "-m", "pytest", "-q", "-o", "cache_dir=/tmp/reconcile-pytest-cache", "backend/tests"]
    volumes:
      - ./backend/tests:/app/backend/tests:ro
      - ./fixtures:/app/fixtures:ro
      - ./ml:/app/ml:ro
    depends_on:
      db: {condition: service_healthy}
  browser-test:
    profiles: [test]
    image: reconcile-local:test
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    command: ["python", "/app/scripts/browser_stack.py"]
    environment:
      <<: *database
      RECONCILE_BROWSER_FIXTURE: "true"
      APP_ORIGINS: http://127.0.0.1:18000
    ports: ["127.0.0.1:18000:8000"]
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      db: {condition: service_healthy}
secrets:
  proxy_ca:
    file: ${RECONCILE_BUILD_CA:-/etc/ssl/certs/ca-certificates.crt}
volumes:
  pgdata:
