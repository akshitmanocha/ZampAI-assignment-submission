services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reconcile
      POSTGRES_DB: reconcile
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconcile -d reconcile"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      secrets:
        - proxy_ca
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://reconcile:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/reconcile
    depends_on:
      db:
        condition: service_healthy
secrets:
  proxy_ca:
    file: ${RECONCILE_BUILD_CA:-/etc/ssl/certs/ca-certificates.crt}
volumes:
  pgdata:
