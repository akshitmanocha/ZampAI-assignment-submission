[project]
name = "reconcile"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "fastapi-users[sqlalchemy]>=14,<16", "python-multipart>=0.0.20", "pdfplumber>=0.11,<1", "pypdfium2>=4.30,<6", "pytesseract>=0.3.13,<1"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "reportlab>=4,<5", "websocket-client>=1.8,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
